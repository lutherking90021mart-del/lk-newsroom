<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">LK Newsroom default article image</title>
  <desc id="description">A professional dark blue news graphic with a red breaking-news accent.</desc>
  <defs><linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#003366"/><stop offset="1" stop-color="#071b2d"/></linearGradient><pattern id="lines" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V36" stroke="#fff" stroke-opacity=".05" stroke-width="2"/></pattern></defs>
  <rect width="1200" height="720" fill="url(#background)"/><rect width="1200" height="720" fill="url(#lines)"/><rect y="548" width="1200" height="172" fill="#e31e24"/>
  <rect x="84" y="86" width="88" height="88" rx="4" fill="#e31e24"/><text x="212" y="147" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="800" letter-spacing="3">LK NEWSROOM</text>
  <text x="87" y="330" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="104" font-weight="800">VERIFIED NEWS</text><rect x="90" y="380" width="440" height="12" fill="#e31e24"/>
  <text x="90" y="472" fill="#c9d9e8" font-family="Arial, Helvetica, sans-serif" font-size="38" letter-spacing="2">INFORMING TODAY, INSPIRING TOMORROW</text>
</svg>
