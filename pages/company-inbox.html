<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Company Inbox | LK Newsroom</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><style>
:root{color-scheme:dark;--bg:#071426;--panel:#10233a;--line:#29415d;--cyan:#20c4df;--text:#f6f9ff;--muted:#aebdd0;--gold:#ffc857}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#123354,transparent 50%),var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}.wrap{max-width:1180px;width:calc(100% - 32px);margin:auto}.top{padding:26px 0;border-bottom:1px solid var(--line)}.brand{font-weight:850;font-size:20px;letter-spacing:-.04em}.brand span{color:var(--cyan)}.toprow{display:flex;justify-content:space-between;align-items:center;gap:16px}.panel{background:#10233acc;border:1px solid var(--line);border-radius:20px;padding:22px;margin:26px 0}.login{max-width:480px;margin:60px auto}.field{display:grid;gap:7px;margin:14px 0}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#071426;color:white}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:750;background:var(--cyan);color:#061528;cursor:pointer}.btn.secondary{background:#233c58;color:white;border:1px solid var(--line)}.btn:disabled{opacity:.6;cursor:wait}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters button.active{outline:2px solid var(--cyan)}.item{border:1px solid var(--line);background:#0b1b2f;border-radius:15px;padding:18px;margin-top:12px}.itemhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.tag{font-size:11px;border-radius:30px;padding:5px 9px;background:#163c50;color:#8ceafa}.message{white-space:pre-wrap;overflow-wrap:anywhere;color:#e3ebf6;margin:14px 0}.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.actions select{background:#071426;color:white;border:1px solid var(--line);border-radius:9px;padding:9px}.notice{margin:12px 0;color:var(--gold)}[hidden]{display:none!important}@media(max-width:600px){.panel{padding:15px}.toprow{align-items:flex-start;flex-direction:column}}
</style></head><body>
<header class="top"><div class="wrap toprow"><div class="brand">LK <span>NEWSROOM</span> · COMPANY INBOX</div><button class="btn secondary" id="logout" hidden>Sign out</button></div></header>
<main class="wrap"><section id="login-panel" class="panel login"><h1>Administrator sign in</h1><p class="muted">Use your existing LK Newsroom staff account. Access is checked by the server.</p><form id="login-form"><label class="field">Email<input id="email" type="email" autocomplete="username" required></label><label class="field">Password<input id="password" type="password" autocomplete="current-password" required></label><button class="btn" type="submit">Sign in securely</button></form><p class="notice" id="login-notice" role="status"></p></section>
<section id="inbox-panel" hidden><div class="toprow" style="margin:28px 0 16px"><div><h1 style="margin-bottom:4px">Company enquiries</h1><p class="muted">Private inbox · Latest 200 messages · Staff access only</p></div><button class="btn" id="refresh"><i class="fa-solid fa-rotate"></i> Refresh</button></div><div class="panel"><div class="filters" id="filters"><button class="btn secondary active" data-status="all">All</button><button class="btn secondary" data-status="new">New</button><button class="btn secondary" data-status="in_progress">In progress</button><button class="btn secondary" data-status="resolved">Resolved</button><button class="btn secondary" data-status="spam">Spam</button></div><p class="notice" id="inbox-notice" role="status"></p><div id="items"></div></div></section></main>
<script src="../js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(function(){
const $=s=>document.querySelector(s);const api=(window.LK_AGGREGATOR_API_URL||location.origin).replace(/\/$/,'');let client=null,token='',status='all';
const supabaseUrl=window.LK_SUPABASE_URL,supabaseKey=window.LK_SUPABASE_ANON_KEY;
function note(id,msg){$(id).textContent=msg||''}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function call(path,options={}){const r=await fetch(api+path,{...options,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,...options.headers}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}
function signedIn(){ $('#login-panel').hidden=true;$('#inbox-panel').hidden=false;$('#logout').hidden=false}
function signedOut(){token='';$('#login-panel').hidden=false;$('#inbox-panel').hidden=true;$('#logout').hidden=true}
async function load(){note('#inbox-notice','Loading enquiries…');try{const d=await call('/v1/admin/company/enquiries?status='+encodeURIComponent(status));const root=$('#items');root.replaceChildren();if(!d.data?.length){root.innerHTML='<p class="muted">No enquiries in this view.</p>';note('#inbox-notice','');return}for(const e of d.data){const article=document.createElement('article');article.className='item';article.innerHTML='<div class="itemhead"><div><strong>'+escapeHtml(e.name)+'</strong><div class="muted">'+escapeHtml(e.email)+' · '+escapeHtml(e.topic)+'</div><div class="muted">'+escapeHtml(new Date(e.created_at).toLocaleString())+'</div></div><span class="tag">'+escapeHtml(e.status.replace('_',' '))+'</span></div><div class="message">'+escapeHtml(e.message)+'</div>'+(e.admin_notes?'<p class="muted">Admin note: '+escapeHtml(e.admin_notes)+'</p>':'')+'<div class="actions"><select aria-label="Update status"><option value="new">New</option><option value="in_progress">In progress</option><option value="resolved">Resolved</option><option value="spam">Spam</option></select><input aria-label="Admin note" placeholder="Internal note (optional)" style="flex:1;min-width:180px;background:#071426;color:white;border:1px solid var(--line);border-radius:9px;padding:9px"><button class="btn">Save</button><a class="btn secondary" href="mailto:'+encodeURIComponent(e.email)+'?subject='+encodeURIComponent('LK Newsroom: '+e.topic)+'">Reply by email</a></div>';const select=article.querySelector('select');select.value=e.status;article.querySelector('button').addEventListener('click',async ev=>{const b=ev.currentTarget;b.disabled=true;try{await call('/v1/admin/company/enquiries/'+encodeURIComponent(e.id),{method:'PATCH',body:JSON.stringify({status:select.value,adminNotes:article.querySelector('input').value||e.admin_notes||''})});note('#inbox-notice','Enquiry updated.');await load()}catch(err){note('#inbox-notice',err.message);b.disabled=false}});root.appendChild(article)}note('#inbox-notice',d.data.length+' enquiry/enquiries loaded.')}catch(err){note('#inbox-notice',err.message);if(/session|staff|sign in|invalid/i.test(err.message))signedOut()}}
$('#login-form').addEventListener('submit',async e=>{e.preventDefault();note('#login-notice','Signing in…');try{if(!window.supabase||!supabaseUrl||!supabaseKey)throw new Error('Supabase public configuration is missing.');client=window.supabase.createClient(supabaseUrl,supabaseKey);const {data,error}=await client.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});if(error)throw error;token=data.session.access_token;await call('/v1/admin/company/enquiries?status=all');signedIn();await load()}catch(err){note('#login-notice',err.message||'Unable to sign in.')}})
$('#logout').addEventListener('click',async()=>{if(client)await client.auth.signOut();signedOut();note('#login-notice','You have signed out.')});
$('#refresh').addEventListener('click',load);$('#filters').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{status=b.dataset.status;$('#filters').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));load()}));
})();
</script></body></html>
