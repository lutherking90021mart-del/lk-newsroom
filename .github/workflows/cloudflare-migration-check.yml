name: Cloudflare migration checks

on:
  push:
    branches:
      - migration/cloudflare-d1-r2-workers
      - main
  pull_request:
    branches:
      - main
    paths:
      - "cloudflare/**"
      - "scripts/buildCloudflareImport.py"
      - "scripts/migrateStorageCsvToR2.ts"
      - "scripts/archiveDatabaseCsvToR2.ts"
      - "services/objectStorage.ts"
      - "scripts/buildCloudflareAssets.mjs"
      - "js/**"
      - "admin/**"
      - "services/**"
      - "package.json"
      - "package-lock.json"
      - "docs/CLOUDFLARE_D1_R2_MIGRATION.md"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-migration-check.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Type-check the existing application
        run: npm run typecheck
      - name: Type-check the Cloudflare Worker and migration scripts
        run: npx tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --skipLibCheck cloudflare/worker.ts scripts/migrateStorageCsvToR2.ts scripts/archiveDatabaseCsvToR2.ts services/objectStorage.ts
      - name: Validate Python import converter syntax
        run: python -m py_compile scripts/buildCloudflareImport.py
      - name: Validate D1 schema with SQLite
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(":memory:")
          db.executescript(Path("cloudflare/schema.sql").read_text(encoding="utf-8"))
          db.executescript(Path("cloudflare/schema-operations.sql").read_text(encoding="utf-8"))
          print("D1 schema and operational tables execute successfully.")
          PY
      - name: Validate browser admin module syntax
        run: |
          node --check js/admin-client.js
          node --check js/auth.js
          node --check js/admin.js
          node --check js/revenue-admin.js
          node --check js/admin-analytics.js
          node --check js/monetization-admin.js
      - name: Validate archive scripts
        run: node --check scripts/archiveDatabaseCsvToR2.ts
      - name: Validate asset-build script syntax
        run: node --check scripts/buildCloudflareAssets.mjs
      - name: Build static preview assets
        run: node scripts/buildCloudflareAssets.mjs
