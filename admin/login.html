<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Sign In | LK Newsroom</title><link rel="icon" href="../assets/lk-newsroom-logo.png"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="../styles/global.css"></head><body><main class="auth-page"><section class="auth-box"><a href="../index.html"><img class="brand" src="../assets/lk-newsroom-logo.png" alt="LK Newsroom"></a><div class="form-card"><span class="eyebrow">Secure newsroom access</span><h1 style="font-size:2rem;margin:7px 0">Welcome back</h1><p class="text-muted">Sign in to manage LK Newsroom.</p><form id="login-form"><div class="form-group"><label for="email">Email address</label><input id="email" name="email" class="form-control" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="form-group"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><label for="password">Password</label><a class="form-help" id="forgot-link" href="forgot-password.html">Forgot password?</a></div><input id="password" name="password" class="form-control" type="password" autocomplete="current-password" required></div><label class="form-help" style="display:block;margin-bottom:18px"><input type="checkbox" name="remember" checked> Remember me</label><button class="btn btn-primary" style="width:100%;justify-content:center" type="submit">Sign in securely <i class="fa-solid fa-arrow-right"></i></button></form><p id="login-help" class="form-help" style="margin-top:18px">Supabase authentication is enabled once project keys are configured. <a id="bootstrap-link" href="/admin/bootstrap.html" hidden>First-time Cloudflare admin setup</a></p></div></section></main><script src="../js/config.js"></script><script>
if(window.LK_CLOUDFLARE_MODE){
 const help=document.getElementById('login-help');if(help)help.firstChild.textContent='Sign in with your Cloudflare newsroom account. ';
 const link=document.getElementById('bootstrap-link');if(link)link.hidden=false;
 const forgot=document.getElementById('forgot-link');if(forgot)forgot.textContent='Account help';
}
</script><script type="module" src="../js/admin-auth.js"></script></body></html>
