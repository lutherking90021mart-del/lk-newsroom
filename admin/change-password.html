<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Change Password | LK Newsroom</title><link rel="icon" href="../assets/lk-newsroom-logo.svg" type="image/svg+xml"><link rel="stylesheet" href="../styles/global.css">
<style>
body{min-height:100vh;background:#071426;color:#edf5ff;font-family:Inter,system-ui,Segoe UI,sans-serif}
.auth-page{display:grid;place-items:center;min-height:100vh;padding:24px}.auth-box{width:min(100%,580px);margin:auto}
.form-card{padding:clamp(20px,4vw,36px);border:1px solid #29415c;background:#0c2037;border-radius:18px;box-shadow:0 25px 70px #0005}
.form-group{margin:14px 0}.form-control{width:100%}#change-error{color:#ff9c9c;white-space:pre-wrap}#change-success{color:#8df0c5;white-space:pre-wrap}
</style>
</head><body><main class="auth-page"><section class="auth-box">
<a href="../index.html"><img src="../assets/lk-newsroom-logo.svg" alt="LK Newsroom" style="width:175px;max-width:70%;height:auto;margin-bottom:22px"></a>
<div class="form-card"><span class="eyebrow">Account security</span><h1 style="font-size:2rem;margin:8px 0">Change your password</h1>
<p class="text-muted">For your security, a new staff account must change the initial password before opening the newsroom dashboard. Use at least 12 characters.</p>
<form id="change-form">
<div class="form-group"><label for="current">Initial/current password</label><input id="current" name="current" class="form-control" type="password" autocomplete="current-password" required></div>
<div class="form-group"><label for="new-password">New password</label><input id="new-password" name="newPassword" class="form-control" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></div>
<div class="form-group"><label for="confirm-password">Confirm new password</label><input id="confirm-password" name="confirmPassword" class="form-control" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></div>
<button id="change-submit" class="btn btn-primary" type="submit" style="width:100%;justify-content:center">Save new password</button>
<p id="change-error" role="alert"></p><p id="change-success" role="status"></p>
</form>
</div></section></main>
<script src="../js/config.js"></script><script type="module">
import { supabase } from "../js/admin-client.js";
const form=document.querySelector("#change-form"),button=document.querySelector("#change-submit"),error=document.querySelector("#change-error"),success=document.querySelector("#change-success");
const {data:{session}}=await supabase.auth.getSession();
if(!session){location.href="/admin/login.html";}
form.addEventListener("submit",async event=>{
 event.preventDefault();error.textContent="";success.textContent="";
 const current=form.elements.current.value, next=form.elements.newPassword.value, confirm=form.elements.confirmPassword.value;
 if(next.length<12){error.textContent="Use at least 12 characters for the new password.";return;}
 if(next!==confirm){error.textContent="The new passwords do not match.";return;}
 if(current===next){error.textContent="Choose a different new password.";return;}
 button.disabled=true;button.textContent="Updating password…";
 try{
  const {error:changeError}=await supabase.auth.updateUser({password:{current,new:next}});
  if(changeError)throw changeError;
  success.textContent="Password changed. Opening the newsroom dashboard…";
  form.reset();
  window.setTimeout(()=>{location.href="/admin/index.html";},800);
 }catch(e){error.textContent=e instanceof Error?e.message:"Unable to change password.";}
 finally{button.disabled=false;button.textContent="Save new password";}
});
</script></body></html>
